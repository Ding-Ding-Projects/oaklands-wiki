name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a stale deploy of the same ref. This workflow only
# publishes the site; it creates no tag and uploads no release asset, so
# cancelling it cannot strand anything half-published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and prerender
        run: npm run build
      # No tests and no lint run here, by standing policy. These two checks are
      # build-output assertions, not code-quality gates: they fail only when the
      # artifact itself is wrong.
      - name: Check built output
        run: npm run check:bundle
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
